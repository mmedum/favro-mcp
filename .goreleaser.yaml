version: 2

project_name: favro-mcp

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: favro-mcp
    main: ./cmd/favro-mcp
    binary: favro-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mmedum/favro-mcp/internal/version.Tag={{ .Tag }}
      - -X github.com/mmedum/favro-mcp/internal/version.Commit={{ .ShortCommit }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: favro-mcp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# github-native hands changelog generation to GitHub's release-notes API,
# which ignores goreleaser's `sort` and `filters` — they were configured here
# for a while and silently did nothing. The human-readable summary comes from
# CHANGELOG.md via --release-header in .github/workflows/release.yml; this
# generated PR list sits underneath it for provenance.
changelog:
  use: github-native

release:
  prerelease: auto
  draft: false
  mode: replace
  name_template: "{{ .ProjectName }} {{ .Tag }}"
