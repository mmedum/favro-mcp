version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - nilerr
    - errorlint
    - contextcheck
    # Style & quality
    - revive
    - gocritic
    - gocyclo
    - unconvert
    - misspell
    - godot
    # Modernization
    - exptostd
    # Security
    - gosec
    # Test hygiene
    - testifylint
    - tparallel
    # Import discipline
    - depguard

  settings:
    gocyclo:
      min-complexity: 10

    revive:
      rules:
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    depguard:
      rules:
        no-testify-assert:
          list-mode: lax
          deny:
            - pkg: "github.com/stretchr/testify/assert"
              desc: "use github.com/stretchr/testify/require instead — assert lets tests continue past failures and produces confusing diagnostics"
        no-default-http-client:
          list-mode: lax
          deny:
            - pkg: "net/http.DefaultClient"
              desc: "always pass an explicit *http.Client with a configured timeout"

    gosec:
      excludes:
        # G104: errcheck already covers unhandled errors with better diagnostics
        - G104

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gosec
      # scripts/gates is maintainer-only tooling and never ships: every
      # gate reads files under the repository root and shells out to
      # git, which is precisely what gosec's G204/G304/G306/G70x warn
      # about. Here that is the job rather than a finding. gocyclo goes
      # with it because a gate is a list of rules, and splitting one
      # into six functions to satisfy a complexity count makes the rules
      # harder to read than the number is worth. Scoped to this
      # directory, so the server's own code keeps both linters.
      - path: ^scripts/gates/
        linters:
          - gosec
        # Named, so the exclusion is the one the comment argues for.
        # Disabling all of gosec here would also switch off G101, the
        # hardcoded-credential rule, in the one package that carries
        # credential-shaped strings on purpose.
        text: "(G204|G304|G306|G70[0-9])"
      - path: ^scripts/gates/
        linters:
          - gocyclo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mmedum/favro-mcp
