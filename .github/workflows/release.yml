name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: unit tests
        run: go test -race ./...

  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
      - name: release notes header
        # Written outside the work tree on purpose: goreleaser refuses to
        # release from a dirty git state, and a file in the repo root would
        # make it one.
        run: scripts/changelog-section.sh "${{ github.ref_name }}" > "${{ runner.temp }}/release-header.md"
      - name: goreleaser release
        run: goreleaser release --clean --release-header="${{ runner.temp }}/release-header.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: package .plugin
        # Plugin packaging shares the goreleaser job because it consumes
        # dist/ — running on a separate runner would lose the artifacts.
        # Skip on pre-release tags: `.plugin` represents a stable install.
        if: ${{ !contains(github.ref, '-') }}
        run: scripts/package-plugin.sh
      - name: attach .plugin to release
        if: ${{ !contains(github.ref, '-') }}
        run: gh release upload "${{ github.ref_name }}" favro-mcp.plugin --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
