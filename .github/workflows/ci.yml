name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        # @v8+ ships golangci-lint v2.x; @v6 / @v7 bundle a v1.x binary
        # built with Go 1.24, which can't read a config targeting Go 1.27+.
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test-unit:
    name: test-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go test
        # Force bash on every OS — PowerShell (the Windows default) tokenizes
        # the `coverage.out` value strangely and Go ends up seeing `.out` as
        # an extra package argument. bash is available on all GH runners.
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  test-mcp:
    name: test-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: in-memory MCP transport tests
        run: go test -race -run 'TestMCP' ./internal/server/...

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: build scan target
        run: go build -o bin/favro-mcp ./cmd/favro-mcp
      - name: govulncheck
        # Binary mode, not source mode. govulncheck's source analysis runs on
        # x/tools' go/types, which as of x/vuln v1.7.0 (x/tools v0.49.0) tops
        # out at go1.26 and errors out on the go1.27 stdlib. Binary mode reads
        # the built artifact's symbol table instead, so it works on 1.27 today
        # and scans exactly what ships. Revert to `govulncheck ./...` once
        # x/vuln ships an x/tools that understands 1.27.
        run: govulncheck -mode=binary bin/favro-mcp

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy diff
        run: go mod tidy -diff
      - name: install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
      - name: snapshot build
        run: goreleaser build --snapshot --clean

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
